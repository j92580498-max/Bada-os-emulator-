name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  QEMU_SOURCE: blake-lucas/qemu-ios
  QEMU_REVISION: 1955aea6930119c34b968c0596dc3cd72d67e839

concurrency:
  group: wave723-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86-64
            runner: ubuntu-24.04
            artifact: linux-x86_64
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            artifact: linux-arm64
          - name: Windows x86-64
            runner: windows-2022
            artifact: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.QEMU_SOURCE }}
          ref: ${{ env.QEMU_REVISION }}
          path: build-qemu-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QEMU and SDL build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libglib2.0-dev libpixman-1-dev libfdt-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxfixes-dev libxkbcommon-dev libwayland-dev wayland-protocols libegl-dev libgl-dev libdbus-1-dev
      - name: Build Linux QEMU
        if: runner.os == 'Linux'
        run: |
          bash scripts/build-qemu.sh build-qemu-source build-qemu linux
          mkdir -p build-qemu/runtime
          install -m 755 build-qemu/qemu-system-arm build-qemu/runtime/qemu-system-arm
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: >-
            git make diffutils
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-glew
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-pixman
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python-pip
      - name: Build Windows QEMU
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          bash scripts/build-qemu.sh build-qemu-source build-qemu windows
          python scripts/windows-runtime.py build-qemu/qemu-system-arm.exe build-qemu/runtime /ucrt64/bin
      - name: Bundle QEMU license
        shell: bash
        run: cp build-qemu-source/COPYING build-qemu/runtime/QEMU-COPYING
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWAVE723_QEMU_RUNTIME=build-qemu/runtime
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package
        run: cmake --install build --config Release --prefix dist/wave723
      - name: Preserve Linux execute permissions
        if: runner.os == 'Linux'
        run: tar -czf wave723-${{ matrix.artifact }}.tar.gz -C dist wave723
      - uses: actions/upload-artifact@v4
        with:
          name: wave723-${{ matrix.artifact }}
          path: ${{ runner.os == 'Linux' && format('wave723-{0}.tar.gz', matrix.artifact) || 'dist/wave723' }}
          if-no-files-found: error

  qemu-android:
    name: Android QEMU (${{ matrix.abi }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.QEMU_SOURCE }}
          ref: ${{ env.QEMU_REVISION }}
          path: build-qemu-source
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config python3-venv autoconf automake libtool gettext autopoint
          python3 -m venv "$RUNNER_TEMP/wave-meson"
          "$RUNNER_TEMP/wave-meson/bin/pip" install meson==1.10.0 packaging==24.0
          echo "$RUNNER_TEMP/wave-meson/bin" >> "$GITHUB_PATH"
          sdkmanager "ndk;27.2.12479018"
      - name: Build Android QEMU
        run: |
          export WAVE723_ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          bash scripts/build-qemu.sh build-qemu-source build-qemu "${{ matrix.abi }}"
          install -m 755 build-qemu/qemu-system-arm libwave723_qemu.so
      - uses: actions/upload-artifact@v4
        with:
          name: wave723-qemu-${{ matrix.abi }}
          path: libwave723_qemu.so
          if-no-files-found: error

  android:
    name: Android APK and emulator test
    needs: qemu-android
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wave723-qemu-arm64-v8a
          path: android/app/src/main/jniLibs/arm64-v8a
      - uses: actions/download-artifact@v4
        with:
          name: wave723-qemu-x86_64
          path: android/app/src/main/jniLibs/x86_64
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android native build dependencies
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"
      - name: Build APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: wave723-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-wave723-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: android/app/build/outputs/androidTest-results
          if-no-files-found: ignore
