name: Stock firmware boot

on:
  workflow_dispatch:
    inputs:
      build_run:
        description: Build run on main with a successful linux-arm64 job
        required: true
      instructions:
        description: Guest instruction budget
        default: '700000000'
        required: true
      survey:
        description: Also trace unknown peripheral accesses after the stock boot
        default: 'off'
        type: choice
        options: ['off', 'apps', 'both']

permissions:
  actions: read
  contents: read

jobs:
  boot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Get the tested emulator
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ inputs.build_run }}
        run: |
          [[ $BUILD_RUN =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" |
            jq -e --arg repo "$GITHUB_REPOSITORY" '
              .head_repository.full_name == $repo and .head_branch == "main" and
              .path == ".github/workflows/build.yml" and
              (.event == "push" or .event == "workflow_dispatch")'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN/jobs" |
            jq -e 'any(.jobs[]; .name == "linux-arm64" and .conclusion == "success")'
          gh run download "$BUILD_RUN" -R "$GITHUB_REPOSITORY" -n wave723-linux-arm64
          tar -xzf wave723-linux-arm64.tar.gz
      - name: Install screenshot tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb xauth xterm xdotool imagemagick fonts-dejavu-core gdb
      - name: Stage the private test input
        env:
          MEDIA_URL: ${{ secrets.WAVE723_MEDIA_URL }}
          MEDIA_KEY: ${{ secrets.WAVE723_MEDIA_KEY }}
        run: |
          set -o pipefail
          [[ $MEDIA_URL == https://release-assets.githubusercontent.com/* && -n $MEDIA_KEY ]]
          umask 077
          mkdir "$RUNNER_TEMP/stock"
          curl --fail --silent --show-error --retry 2 --output "$RUNNER_TEMP/input.gpg" "$MEDIA_URL"
          gpg --batch --pinentry-mode loopback --passphrase-fd 3 3<<<"$MEDIA_KEY" \
            --decrypt "$RUNNER_TEMP/input.gpg" |
            tar -x -C "$RUNNER_TEMP/stock" --no-same-owner --no-same-permissions \
              S7230EXXKG1_OXGKG2.zip S7230EXXKG1_OXGKG2/BOOTFILES/sysparm_{ind,dep}.img
      - name: Boot XXKG1 and capture the LCD
        id: stock
        env:
          BUDGET: ${{ inputs.instructions }}
        run: |
          [[ $BUDGET =~ ^[1-9][0-9]{0,9}$ ]]
          export WAVE723_QEMU="$PWD/scripts/survey-engine.sh"
          export WAVE723_SURVEY_ENGINE="$PWD/wave723/qemu-system-arm"
          export WAVE723_SURVEY_SCOPE=stock
          export WAVE723_PANEL_SAMPLE="$RUNNER_TEMP/panel.rgb"
          xvfb-run -a -s '-screen 0 1600x1000x24' bash scripts/capture-stock.sh \
            ./wave723/wave723 "$RUNNER_TEMP/stock/S7230EXXKG1_OXGKG2.zip" "$BUDGET"
      - name: Save the sampled panel RAM
        if: ${{ !cancelled() && (steps.stock.outcome == 'success' || steps.stock.outcome == 'failure') }}
        run: |
          [[ $(stat -c %s "$RUNNER_TEMP/panel.rgb") == 288000 ]]
          convert -size 240x400 -depth 8 "rgb:$RUNNER_TEMP/panel.rgb" stock-images/04-panel-memory.png
      - name: Diagnostic peripheral survey
        if: ${{ failure() && steps.stock.outcome == 'failure' && inputs.survey != 'off' }}
        env:
          BUDGET: ${{ inputs.instructions }}
          WAVE723_SURVEY_SCOPE: ${{ inputs.survey }}
        run: |
          export WAVE723_QEMU="$PWD/scripts/survey-engine.sh"
          export WAVE723_SURVEY_ENGINE="$PWD/wave723/qemu-system-arm"
          xvfb-run -a -s '-screen 0 1600x1000x24' bash scripts/capture-stock.sh \
            ./wave723/wave723 "$RUNNER_TEMP/stock/S7230EXXKG1_OXGKG2.zip" "$BUDGET" survey
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('stock-images/*.png') != '' }}
        with:
          name: stock-images
          path: stock-images/*.png
          if-no-files-found: error
          retention-days: 3
